<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Shreenath Solar Quotations</title>
<meta name="description" content="Shreenath Solar quotation maker. Works offline; data stays on this device.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shreenath Quotes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --ink:#13294B; --ink2:#24406B; --saffron:#E98A15; --sun:#F6C453; --leaf:#2E7D4F; --blue:#2F5FD0; --amber:#EBA91F; --teal:#0F7F86; --inv:#111111; --focus:#111111;
  --paper:#F2F2F2; --card:#FFFFFF; --line:#D9D9D9; --muted:#666666; --danger:#B42318; --band:#EEEEEE;
  --text:#111111;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme: light;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#000000; --card:#141414; --line:#2E2E2E; --muted:#A6A6A6; --band:#222222; --text:#F2F2F2; --inv:#262626; --blue:#4C7BE8; --teal:#1E9AA2; --focus:#FFFFFF; color-scheme:dark; }
}
:root[data-theme="dark"]{ --paper:#000000; --card:#141414; --line:#2E2E2E; --muted:#A6A6A6; --band:#222222; --text:#F2F2F2; --inv:#262626; --blue:#4C7BE8; --teal:#1E9AA2; --focus:#FFFFFF; color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px); -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0; background:var(--paper); color:var(--text); font:16px/1.5 "Segoe UI",Roboto,"Noto Sans",system-ui,sans-serif; -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important; animation:none!important}}

/* Top bar: echoes the letterhead rule */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:#000; color:#fff}
.top .in{max-width:860px; margin:0 auto; display:flex; align-items:center; gap:8px; padding:10px 12px}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.brand b{font-family:Georgia,"Bookman Old Style",serif; font-size:15px; letter-spacing:.2px; white-space:nowrap}
.brand small{display:block; color:#ffffffa8; font-size:12.5px; line-height:1.1}
.rule{height:5px; background:linear-gradient(var(--saffron),var(--saffron)) top/100% 3px no-repeat, linear-gradient(var(--sun),var(--sun)) bottom/100% 1px no-repeat}
.top nav{margin-left:auto; display:flex; gap:4px}
.top nav button{background:none; border:0; color:#ffffffb0; padding:8px 9px; border-radius:8px; min-height:40px; cursor:pointer}
.top nav button[aria-current="page"]{color:#fff; background:#ffffff1f; font-weight:600}

main{max-width:860px; margin:0 auto; padding:16px 16px 120px}
h1{font-family:Georgia,"Bookman Old Style",serif; font-size:24px; margin:4px 0 14px; line-height:1.25}
h2{font-size:16px; margin:0; font-weight:700}
.muted{color:var(--muted)}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:46px; padding:0 16px; border-radius:10px; border:1px solid transparent; font-weight:600; cursor:pointer; text-decoration:none; white-space:nowrap}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.primary{background:var(--blue); color:#fff}
.btn.accent{background:var(--amber); color:#111}
.btn.wa{background:#1F8F4E; color:#fff}
.btn.outline{background:var(--teal); border-color:transparent; color:#fff}
.btn.ghost{background:none; color:var(--text)}
.btn.gray{background:color-mix(in srgb,var(--text) 12%,var(--card)); color:var(--text)}
.btn.danger{background:none; color:var(--danger); border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.btn.sm{min-height:38px; padding:0 12px; font-size:14.5px}
.btn.block{width:100%}

.card{background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:14px}
.card > header{display:flex; align-items:center; gap:8px; padding:12px 16px; border-bottom:1px solid var(--line)}
.card > .body{padding:14px 16px}
.grid{display:grid; gap:12px; grid-template-columns:1fr 1fr}
.grid .full{grid-column:1/-1}
@media (max-width:520px){ .grid.r{grid-template-columns:1fr} }
label.f{display:flex; flex-direction:column; gap:4px; font-size:14px; font-weight:600; color:var(--muted)}
label.f > span{color:var(--text); font-weight:600}
input,select,textarea{width:100%; min-height:46px; padding:10px 12px; border:1px solid var(--line); border-radius:9px; background:var(--card); color:var(--text); font-size:16px; font-weight:400}
textarea{min-height:88px; line-height:1.45; resize:vertical}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--focus); box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 18%,transparent)}
.calc{display:flex; justify-content:space-between; align-items:baseline; gap:8px; padding:10px 12px; border-radius:9px; background:var(--band); font-size:15px}
.calc b{font-size:18px; font-variant-numeric:tabular-nums}
.calc.big{background:var(--inv); color:#fff}
.calc.big b{font-size:22px; color:#fff}
.warn{font-size:14px; color:var(--text); font-weight:600; margin-top:6px}

/* Quotation list */
.qitem{display:grid; grid-template-columns:58px 1fr auto; gap:6px 12px; align-items:center; padding:12px 14px; border-top:1px solid var(--line)}
@media (max-width:560px){ .qitem{grid-template-columns:58px 1fr} .qitem .acts{grid-column:1/-1; justify-content:stretch} .qitem .acts .btn{flex:1} }
.qitem:first-child{border-top:0}
.qitem .kw{flex:none; width:58px; height:58px; border-radius:10px; background:var(--inv); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1}
.qitem .kw b{font-size:19px; color:#fff} .qitem .kw small{font-size:11.5px; margin-top:3px; opacity:.8}
.qitem .info{min-width:0; flex:1}
.qitem .info b{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.qitem .info small{color:var(--muted); font-size:13.5px}
.qitem .acts{display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end}
.empty{text-align:center; padding:36px 18px}
.search{margin-bottom:12px}

/* BOM editor */
.bomrow{border-top:1px solid var(--line); padding:10px 0; display:grid; grid-template-columns:28px 1fr auto; gap:8px; align-items:start}
.bomrow:first-child{border-top:0}
.bomrow .sr{font-weight:700; color:var(--muted); padding-top:12px; text-align:right; font-variant-numeric:tabular-nums}
.bomrow .fields{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.bomrow .fields input{min-height:40px; padding:7px 10px; font-size:15px}
.bomrow .fields .p{grid-column:1/-1; font-weight:600}
.bomrow .fields .qty{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.bomrow .tools{display:flex; flex-direction:column; gap:2px}
.ib{width:38px; height:36px; border:0; background:none; border-radius:8px; color:var(--muted); cursor:pointer; font-size:17px; line-height:1}
.ib:hover{background:var(--band); color:var(--text)} .ib.del{color:var(--danger)} .ib:disabled{opacity:.25}
.linked{font-size:12px; color:var(--muted); font-weight:600; grid-column:1/-1}

/* Sticky action bar */
.bar{position:fixed; left:0; right:0; bottom:0; z-index:30; background:color-mix(in srgb,var(--card) 94%,transparent); backdrop-filter:blur(8px); border-top:1px solid var(--line); padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:860px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; gap:8px}
.bar .status{grid-column:1/-1; font-size:13px; color:var(--muted); display:flex; justify-content:space-between; gap:8px}

/* Preview */
.overlay{position:fixed; inset:0; z-index:50; background:#2b2b2b; display:flex; flex-direction:column}
.overlay .ohead{display:flex; align-items:center; gap:8px; padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px; background:#000; color:#fff}
.overlay .ohead b{flex:1}
.overlay .pages{flex:1; overflow:auto; padding:14px 0 calc(90px + env(safe-area-inset-bottom,0px))}
.pagewrap{margin:0 auto 14px; transform-origin:top left}
.page{width:794px; height:1123px; background:#fff; color:#111; position:relative; padding:57px 57px 50px; font-family:"Bookman Old Style","Book Antiqua",Georgia,serif; font-size:13.5px; line-height:1.45; box-shadow:0 2px 10px #0006; overflow:hidden}
.page .wm{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; opacity:.15}
.page .wm img{width:62%}
.lh{text-align:center; position:relative}
.lh .logo{position:absolute; left:0; top:0; width:84px; height:84px; object-fit:contain}
.lh .stamp-r{position:absolute; right:0; top:0; width:84px; height:84px; object-fit:contain}
.lh h3{margin:0; color:#13294B; font-size:23px; letter-spacing:.3px; font-weight:700}
.lh .l2{color:#C26D06; font-weight:700; font-size:13px}
.lh .l3{font-size:12px; color:#333}
.lh .rule{margin-top:8px}
.mini{display:flex; justify-content:space-between; font-size:11.5px; color:#13294B; border-bottom:1.5px solid #E98A15; padding-bottom:4px; margin-bottom:14px}
.foot{position:absolute; left:57px; right:57px; bottom:24px; display:flex; justify-content:space-between; font-size:10.5px; color:#667}
.meta{display:flex; justify-content:space-between; gap:20px; margin:16px 0 10px}
.meta .to b{font-size:14.5px}
.ptitle{text-align:center; font-weight:700; font-size:16px; color:#13294B; text-decoration:underline; text-underline-offset:3px; margin:12px 0}
.page p{margin:0 0 9px; text-align:justify}
table.pt{width:100%; border-collapse:collapse; font-size:12.5px; margin:8px 0}
table.pt th{background:#13294B; color:#fff; padding:6px 7px; text-align:left; font-weight:700}
table.pt td{padding:5px 7px; border:1px solid #c9d6e6; vertical-align:top}
table.pt tbody tr:nth-child(odd) td{background:#DDEBF7}
table.pt tbody tr:nth-child(even) td{background:#BDD7EE}
table.price tbody tr td{background:#fff!important}
table.price tr.tot td{background:#13294B!important; color:#fff; font-weight:700}
table.price tr.sub td{background:#DDEBF7!important}
.num{text-align:right; white-space:nowrap}
.sign{margin-top:18px; text-align:right}
.sign img{height:90px; display:block; margin:4px 0 4px auto}
.sign .blank{height:64px}
.th{font-weight:700; color:#13294B; margin:9px 0 3px; font-size:13.5px}
.page ol{margin:0 0 4px; padding-left:20px} .page li{margin-bottom:2px}
.bank{border:1.5px solid #13294B; padding:8px 12px; margin-top:12px; font-size:12.5px; display:grid; grid-template-columns:110px 1fr; gap:2px 10px}
.bank .bh{grid-column:1/-1; font-weight:700; color:#13294B; margin-bottom:3px}

.toast{position:fixed; left:50%; bottom:calc(150px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:#111; border:1px solid #444; color:#fff; padding:10px 16px; border-radius:10px; z-index:80; font-size:15px; box-shadow:0 6px 20px #0004; max-width:90vw}
.thumb{width:88px; height:88px; border:1px dashed var(--line); border-radius:10px; display:flex; align-items:center; justify-content:center; overflow:hidden; background:#fff}
.thumb img{max-width:100%; max-height:100%}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.hidden{display:none!important}
.chip{display:inline-block; font-size:12px; padding:2px 8px; border-radius:20px; background:var(--band); color:var(--muted)}
.page{height:auto!important; min-height:1123px; padding-bottom:70px!important}
.page .wm .wmtext{font:700 110px Georgia,serif; color:#13294B; transform:rotate(-35deg); opacity:.75}
.lh.haslogo{padding:0 0 0 118px; min-height:100px}
.lh.haslogo .logo{width:100px; height:100px}
.lh.haslogo .rule{margin-left:-118px}
.lh h3{white-space:nowrap}
.lh .l1{color:#C26D06; font-weight:700; font-style:italic; font-size:13px}
.lh .l2{color:#13294B!important; font-size:14px!important}
h2.sec{font-size:21px; color:#13294B; margin:6px 0 2px; position:relative; padding-bottom:6px}
h2.sec::after{content:""; position:absolute; left:0; bottom:0; width:84px; height:4px; background:#E98A15}
.secsub{font-style:italic; color:#5a5a64; margin:6px 0 10px}
table.kv td:first-child{width:200px; background:#DDEBF7!important; font-weight:700}
table.kv td{background:#fff!important; padding:7px 9px; font-size:14px}
table.kv.big td{font-size:16px; font-weight:700; padding:10px 12px}
table.bomt td{font-size:14px; padding:7px 8px}
.page .th{font-size:15.5px; margin:16px 0 6px}
.page ol li{margin-bottom:5px; text-align:justify; font-size:14px}
.page p.one{font-size:14px}
.note{font-style:italic; color:#555; font-size:12.5px!important}
.enc{margin-left:6px} .signbottom{position:absolute; right:57px; bottom:150px}
.acc{display:flex; justify-content:space-between; margin-top:52px; gap:20px}
.acc span{flex:1; border-top:1px solid #777; padding-top:6px; font-size:13.5px}
.page .howimg{display:block; width:83%; margin:6px auto 0; border:1px solid #c9d6e6}
.phgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px}
.thumb.wide{width:100%; height:96px}
.thumb.wide img{width:100%; height:100%; object-fit:cover}
.phl{font-size:13.5px; font-weight:600; margin:5px 0}
.page .band{display:flex; justify-content:space-between; background:#13294B; color:#fff; padding:7px 14px; font-weight:700; font-size:14px; margin-top:4px}
.page .band b{color:#F6C453}
.page .hero{display:flex; gap:8px; margin:8px 0 6px; height:151px}
.page .hero img{flex:1; min-width:0; height:100%; object-fit:cover; border:1px solid #c9d6e6}
.page .hero img.wide{object-fit:contain; background:#eef3f9}
.mini .minilogo{height:34px; margin-right:8px; vertical-align:middle}
.mini{align-items:center}
.equip{display:flex; gap:18px; align-items:flex-start}
.equip .eqimg{width:196px; height:226px; object-fit:cover; border:1px solid #c9d6e6; flex:none}
table.kv.small td{font-size:12.5px; padding:5px 7px}
table.kv.small td:first-child{width:130px}
.kf{font-weight:700; color:#13294B; margin:8px 0 3px; font-size:13.5px}
ul.dots{margin:0 0 6px; padding-left:18px} ul.dots li{margin-bottom:3px; font-size:14px} ul.dots li::marker{color:#E98A15}
.comps{display:grid; grid-template-columns:1fr 1fr; gap:22px}
.comp{border:1px solid #c9d6e6; height:438px; overflow:hidden; background:#fff}
.comp > img{width:100%; height:181px; object-fit:cover; border-bottom:4px solid #E98A15; display:block}
.comp .cb{padding:10px 14px} .comp p{font-size:13px} .comp ul.dots li{font-size:12.5px}
.gal{display:grid; grid-template-columns:repeat(3,1fr); gap:11px}
.gal img{width:100%; aspect-ratio:1/.72; object-fit:cover; border:1px solid #c9d6e6}
.compact .th{font-size:14px; margin:9px 0 3px} .compact ol li, .compact p.one{font-size:12.6px; margin-bottom:2px}
.dlg{position:fixed; inset:0; z-index:200; background:rgba(10,20,40,.55); display:flex; align-items:center; justify-content:center; padding:20px}
.dlgbox{background:var(--card); color:var(--text); border-radius:14px; padding:20px; width:100%; max-width:380px; box-shadow:0 12px 40px rgba(0,0,0,.35)}
.dlgbox p{margin:0 0 18px; font-size:16px; line-height:1.45}
.dlgbtns{display:flex; gap:10px} .dlgbtns .btn{flex:1}
.btn.dlgdanger{background:#B42318; color:#fff}
/* Form: black and white base, each section has its own colour */
.card.sec{border-left:6px solid var(--text); overflow:hidden}
.card.sec > header{background:var(--band)}
.card.sec h2{font-size:17px}
.sec .num{flex:none; width:28px; height:28px; border-radius:50%; background:var(--text); color:var(--card); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px}
.sec input,.sec select,.sec textarea{border:1.5px solid color-mix(in srgb,var(--text) 35%,transparent); background:var(--card)}
.sec input:focus,.sec select:focus,.sec textarea:focus{border-color:var(--text); box-shadow:0 0 0 3px color-mix(in srgb,var(--text) 15%,transparent)}
.sec label.f{color:var(--text)}
.sec .calc:not(.big){background:var(--band); border:1px solid var(--line)}
.sec .calc:not(.big) b{color:var(--text)}
.sec .bomrow .sr{color:var(--text)}
.sec .bomrow .fields input.p{border-color:color-mix(in srgb,var(--text) 55%,transparent)}
/* Top bar fits narrow phones */
.top .in{padding:10px 12px; gap:8px}
.brand{flex:1; min-width:0}
.brand b{font-size:15px; overflow:hidden; text-overflow:ellipsis}
.top nav{flex:none}
.top nav button{padding:8px 9px}
@media (max-width:430px){ .brand small{display:none} }
@media (max-width:430px){.brand small{display:none}}
input,select,textarea{scroll-margin-bottom:140px; scroll-margin-top:80px}
.top .rule{height:1px; background:#3a3a3a}
.top .in{gap:6px; padding:8px 12px}
.brand{flex:1 1 auto; min-width:0; gap:8px}
.brand > div{min-width:0}
.brand b{font-size:15px; display:block; overflow:hidden; text-overflow:ellipsis}
.top nav{flex:none}
.top nav button{padding:8px 9px}
.bar .btn{min-width:0; padding:0 8px; white-space:normal; line-height:1.15}
.top nav #installbtn{background:var(--sun); color:#111; font-weight:600}
@media (max-width:440px){ .top nav #installbtn{font-size:0; padding:8px 11px} .top nav #installbtn::before{content:"⤓"; font-size:19px; line-height:1} }
</style>
</head>

<div class="top">
  <div class="in">
    <div class="brand">
      <img id="toplogo" alt="" width="40" height="40" style="width:40px;height:40px;object-fit:contain;flex:none">
      <div><b>Shreenath Solar</b><small>Quotations</small></div>
    </div>
    <nav>
      <button data-go="list" aria-current="page">Quotations</button>
      <button data-go="settings">Settings</button>
      <button id="installbtn" type="button" class="hidden" title="Install this app on this device" aria-label="Install app">Install</button>
    </nav>
  </div>
  <div class="rule"></div>
</div>
<main id="app"></main>

<div id="overlay" class="overlay hidden" role="dialog" aria-label="Quotation preview"></div>

const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const num = v => { const n = parseFloat(String(v ?? "").replace(/[^0-9.\-]/g,"")); return isFinite(n) ? n : 0; };
const inr = n => Math.round(n).toLocaleString("en-IN");
const kwText = n => { const v = num(n); return v ? String(+v.toFixed(2)) : "—"; };
const today = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const dmy = iso => { if(!iso) return ""; const [y,m,d] = iso.split("-"); return `${d}-${m}-${y}`; };
const fy = iso => { const d = iso ? new Date(iso+"T00:00") : new Date(); const y = d.getFullYear(); const s = d.getMonth() >= 3 ? y : y-1; return String(s).slice(2)+"-"+String(s+1).slice(2); };
const dt = ms => { if (!ms) return "-"; const d = new Date(ms); return d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}) + ", " + d.toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"}); };
const uid = () => "q" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const subLabel = q => (q.subsidyLabel || "").trim() || "Less: Government subsidy";
function dcKwp(q){ return num(q.panel.watt) * num(q.panel.qty) / 1000; }
function effective(q){ return num(q.price) - num(q.subsidy); }
function waNumber(m){
  let d = String(m||"").replace(/\D/g,"");
  if (d.length === 11 && d[0] === "0") d = d.slice(1);
  if (d.length === 10 && /^[6-9]/.test(d)) return "91" + d;
  if (d.length === 12 && d.startsWith("91")) return d;
  return "";
}
function words(n){
  n = Math.round(n); if (!n) return "Zero";
  const a=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const b=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  const two = x => x<20 ? a[x] : b[Math.floor(x/10)] + (x%10 ? " "+a[x%10] : "");
  const three = x => (x>=100 ? a[Math.floor(x/100)]+" Hundred"+(x%100?" ":"") : "") + (x%100 ? two(x%100) : "");
  const parts=[]; const cr=Math.floor(n/1e7); n%=1e7; const lk=Math.floor(n/1e5); n%=1e5; const th=Math.floor(n/1e3); n%=1e3;
  if(cr) parts.push(three(cr)+" Crore"); if(lk) parts.push(two(lk)+" Lakh"); if(th) parts.push(two(th)+" Thousand"); if(n) parts.push(three(n));
  return parts.join(" ");
}

    wrap.innerHTML = `<div class="dlgbox"><p></p><div class="dlgbtns"><button class="btn gray" data-no>Cancel</button><button class="btn ${danger ? "dlgdanger" : "primary"}" data-yes>${esc(okLabel)}</button></div></div>`;
    wrap.querySelector("p").textContent = message;
    const done = v => { wrap.remove(); document.removeEventListener("keydown", onKey); res(v); };

/* Save a file to the device (Downloads folder) */
async function saveBlob(blob, name, okMsg = "PDF downloaded"){
  try {
    const dl = window.claude && window.claude.use ? await Promise.race([window.claude.use("downloads"), new Promise(r => setTimeout(()=>r(null), 1500))]) : null;
    if (dl){ await dl.save({ filename: name, data: blob }); toast("Saved"); return; }
  } catch (e) { if (e && e.code === "declined") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);

/* Share a PDF with the phone's / laptop's own share menu (WhatsApp, Gmail, etc.) */
async function shareBlob(blob, name, q){
  const file = new File([blob], name, { type:"application/pdf" });

function mergeSettings(saved){
  const d = clone(DEFAULT_SETTINGS), s = Object.assign(d, saved || {});
  s.company = Object.assign(clone(DEFAULT_SETTINGS.company), (saved||{}).company || {});
  s.bank = Object.assign(clone(DEFAULT_SETTINGS.bank), (saved||{}).bank || {});
  s.numbering = Object.assign(clone(DEFAULT_SETTINGS.numbering), (saved||{}).numbering || {});
  s.product = Object.assign(clone(DEFAULT_SETTINGS.product), (saved||{}).product || {});
  s.product.components = Object.assign(clone(DEFAULT_SETTINGS.product.components), ((saved||{}).product||{}).components || {});
  if (!saved || !saved.v || saved.v < 2){
    /* v2: new header line, Mr. Gadge's name and address removed from header, terms split over pages 5 and 6 */
    s.company.headerLine = DEFAULT_SETTINGS.company.headerLine; delete s.company.licence;
    s.terms = (s.terms || []).map((t,i) => Object.assign({}, t, { page: t.page || (i < 3 ? 5 : 6), title: t.title === "Terms of business" ? "Payment, AMC and site" : t.title === "Note" ? "Notes and exclusions" : t.title }));
    s.v = 2;
  }
  if (!saved || !saved.v || saved.v < 3){
    /* v3: Shreenath Electrical and Solar logo in header and watermark */
    if (!s.logo) s.logo = DEFAULT_ASSETS.logo;
    s.watermark = true; s.v = 3;
  }
  if (s.v < 4){
    /* v4: proprietor name removed from the whole quotation */
    s.company.person = ""; s.company.qualification = ""; s.company.designation = "Authorised Signatory";
    if (s.product && Array.isArray(s.product.why)) s.product.why = s.product.why.filter(l => !/mayuresh|gadge/i.test(l));
    s.v = 4;
  }
  if (s.v < 5){
    /* v5: default BOM for NEW quotations: Lot -> Set, cables 6 sq.mm, Havells DB, Anchor conduit, Asian Paints */
    s.bom = (s.bom || []).map(r => {
      const x = Object.assign({}, r), p = String(x.p || "");
      if (/^lot$/i.test(String(x.unit || "").trim())) x.unit = "Set";
      if (/^dc cable/i.test(p) || /^ac cable/i.test(p)) x.spec = "6 sq.mm";
      if (/dcdb|acdb|junction box/i.test(p)) x.make = "Havells";
      if (/conduit|cable tray/i.test(p)) x.make = "Anchor";
      if (/^paint/i.test(p)) x.make = "Asian Paints";
      return x;
    });

  }

}

/* ============================================================
   On-device database (IndexedDB). Nothing is sent online.
   ============================================================ */
const DB = {
  db: null,
  open(){
    return new Promise((res, rej) => {
      if (!("indexedDB" in window)) return rej(new Error("IndexedDB not available"));
      let r; try { r = indexedDB.open("shreenath-quotations", 1); } catch (e) { return rej(e); }
      r.onupgradeneeded = () => { const d = r.result;
        if (!d.objectStoreNames.contains("quotes")) d.createObjectStore("quotes", { keyPath:"id" });
        if (!d.objectStoreNames.contains("kv")) d.createObjectStore("kv");
        if (!d.objectStoreNames.contains("pdfs")) d.createObjectStore("pdfs", { keyPath:"id" }); };
      r.onsuccess = () => { this.db = r.result; this.db.onversionchange = () => this.db.close(); res(this.db); };
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error("Database blocked"));
    });
  },
  tx(store, mode, fn){
    return new Promise((res, rej) => {
      if (!this.db) return rej(new Error("No database"));
      let t; try { t = this.db.transaction(store, mode); } catch (e) { return rej(e); }
      let out; const r = fn(t.objectStore(store)); if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error("Aborted"));
    });
  },
  get(store, key){ return this.tx(store, "readonly", s => s.get(key)); },
  getAll(store){ return this.tx(store, "readonly", s => s.getAll()); },
  put(store, val, key){ return this.tx(store, "readwrite", s => key === undefined ? s.put(val) : s.put(val, key)); },
  del(store, key){ return this.tx(store, "readwrite", s => s.delete(key)); }
};
const saveFail = e => toast("Could not save on this device" + (e && /quota/i.test(String(e.name) + String(e.message)) ? ": storage is full. Delete old quotations or photos." : "."), 4200);
const Store = {
  quotes: {}, settings: clone(DEFAULT_SETTINGS), synced: false, lastBackup: 0,
  loadLocal(){
    try { this.quotes = JSON.parse(localStorage.getItem(LS_Q) || "{}") || {}; } catch { this.quotes = {}; }
    try { const s = JSON.parse(localStorage.getItem(LS_S) || "null"); if (s) this.settings = mergeSettings(s); } catch {}
  },
  saveLocal(){
    if (DB.db) return;
    try { localStorage.setItem(LS_Q, JSON.stringify(this.quotes)); localStorage.setItem(LS_S, JSON.stringify(this.settings)); }
    catch { toast("This device's storage is full. Remove the logo or old quotations."); }
  },
  /* Open the on-device database. The first time, copy over anything the earlier version saved in this browser. */
  async load(){
    try { await DB.open(); } catch { DB.db = null; }
    if (!DB.db){ this.loadLocal(); return false; }
    const [qs, s, done, lb] = await Promise.all([DB.getAll("quotes"), DB.get("kv","settings"), DB.get("kv","migrated"), DB.get("kv","lastBackup")]);
    this.lastBackup = lb || 0;
    this.quotes = {}; for (const q of qs || []) if (q && q.id) this.quotes[q.id] = q;
    if (s) this.settings = mergeSettings(s);
    if (done) return false;
    const dbQuotes = this.quotes, dbSettings = this.settings;
    this.quotes = {}; this.settings = clone(DEFAULT_SETTINGS);
    this.loadLocal();
    for (const q of Object.values(dbQuotes)) if (!this.quotes[q.id] || (q.updatedAt||0) >= (this.quotes[q.id].updatedAt||0)) this.quotes[q.id] = q;
    for (const [id, q] of Object.entries(this.quotes)) if (!q || q.deleted) delete this.quotes[id];
    if (s && (dbSettings.updatedAt||0) >= (this.settings.updatedAt||0)) this.settings = dbSettings;
    try {
      await DB.tx("quotes", "readwrite", st => { for (const q of Object.values(this.quotes)) st.put(q); });
      await DB.put("kv", this.settings, "settings");
    } catch (e) { saveFail(e); }
    return true;
  },
  restoreQuote(q){ if (!q.updatedAt) q.updatedAt = Date.now(); this.quotes[q.id] = q; if (DB.db) DB.put("quotes", q).catch(saveFail); else this.saveLocal(); },
  putQuote(q){ q.updatedAt = Date.now(); this.quotes[q.id] = q; if (DB.db) DB.put("quotes", q).catch(saveFail); else this.saveLocal(); },
  removeQuote(id){ delete this.quotes[id]; PdfStore.remove(id); if (DB.db) DB.del("quotes", id).catch(saveFail); else this.saveLocal(); },
  putSettings(){ this.settings.updatedAt = Date.now(); if (DB.db) DB.put("kv", this.settings, "settings").catch(saveFail); else this.saveLocal(); },
  seqOf(no){ const m = /(\d+)\s*$/.exec(String(no || "")); return m ? +m[1] : 0; },
  /* next free sequence: after the highest number already used by a saved quotation, and never below the "Next number" setting */
  peekSeq(){ let max = 0; for (const q of Object.values(this.quotes)) max = Math.max(max, this.seqOf(q.no)); return Math.max(+this.settings.numbering.next || 1, max + 1); },
  fmtNo(seq, dateIso){ const n = this.settings.numbering; return `${n.prefix}/${fy(dateIso)}/${n.code}/${String(seq).padStart(3,"0")}`; },
  peekNumber(dateIso){ return this.fmtNo(this.peekSeq(), dateIso); },
  nextNumber(dateIso){
    const seq = this.peekSeq(), n = this.settings.numbering;
    n.next = seq + 1; this.putSettings(); return this.fmtNo(seq, dateIso);
  },
  numberTaken(no, exceptId){ const k = String(no || "").trim().toLowerCase(); return !!k && Object.values(this.quotes).some(q => q.id !== exceptId && String(q.no || "").trim().toLowerCase() === k); }
};

const _art = {};
function artUrl(kind){
  if (_art[kind]) return _art[kind];
  _art[kind] = new Promise(res => {
    const svg = artSvg(kind), vb = svg.match(/viewBox="0 0 (\d+) (\d+)"/), w = +vb[1], h = +vb[2], scale = 4;
    const img = new Image();
    img.onload = () => { const c = document.createElement("canvas"); c.width = w*scale; c.height = h*scale; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL("image/png")); };
    img.onerror = () => res("");
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  });
  return _art[kind];
}
/* Crop a photo to the box's shape so it fills it neatly */
const _crop = {};
function cropTo(dataUrl, aspect){
  const key = dataUrl.length + ":" + dataUrl.slice(-40) + ":" + aspect.toFixed(3);
  if (_crop[key]) return _crop[key];
  _crop[key] = new Promise(res => {
    const img = new Image();
    img.onload = () => {
      let sw = img.naturalWidth, sh = img.naturalHeight, sx = 0, sy = 0;
      if (sw / sh > aspect){ const nw = sh * aspect; sx = (sw - nw) / 2; sw = nw; } else { const nh = sw / aspect; sy = (sh - nh) / 2; sh = nh; }
      const W = Math.min(900, Math.round(sw)), H = Math.round(W / aspect);
      const c = document.createElement("canvas"); c.width = W; c.height = H;
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0,0,W,H); g.drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
      res(c.toDataURL("image/jpeg", 0.76));
    };
    img.onerror = () => res("");
    img.src = dataUrl;
  });
  return _crop[key];
}
/* Photo if uploaded, otherwise the matching illustration */
async function visual(slot, art, aspect){
  const ph = Photos.get(slot);
  if (ph){ const c = await cropTo(ph, aspect); if (c) return { src:c, photo:true }; }
  return { src: await artUrl(art), photo:false };
}

function parseKV(lines){ return parseLines(lines).map(l => { const i = l.indexOf(":"); return i > 0 ? [l.slice(0,i).trim(), l.slice(i+1).trim()] : [l, ""]; }); }

function quoteContent(q){
  const S = Store.settings, P = S.product;

  const token = Math.min(10000, price), adv = Math.round(price * 0.8);
  let pSpecs = parseKV(P.panelSpecs), pFeats = parseLines(P.panelFeatures);
  if (PANEL_MODELS.includes(q.panel.model) || dcrOf(q.panel.model)){
    const tech = panelTech(q.panel.model), d = dcrOf(q.panel.model);
    if (tech) pSpecs = pSpecs.map(([k,v]) => /^technology$/i.test(k) ? [k, tech] : [k,v]);
    if (d === "non"){ pSpecs = pSpecs.map(([k,v]) => /^cell type$/i.test(k) ? [k, "Non-DCR"] : [k,v]); pFeats = pFeats.filter(l => !/\bDCR\b/i.test(l)); }

  }

  return {
    summary: [
      ["System capacity", `${kwText(q.capacity)} kW`],
      ["DC capacity", `${dc.toFixed(2)} kWp (${q.panel.watt || 0} Wp x ${q.panel.qty || 0} panels)`],
      ["Meter phase", q.phase || "-"],
      ["Panel company", q.panel.company || "-"],
      ["Panel model", [q.panel.model, q.panel.watt && q.panel.watt + " Wp"].filter(Boolean).join(", ") || "-"],
      ["Panel quantity", `${q.panel.qty || 0} Nos`],
      ["Inverter company", q.inverter.company || "-"],
      ["Inverter model", q.inverter.model || "-"],
      ["Inverter capacity", `${q.inverter.kw || 0} kW x ${q.inverter.qty || 0}`],
      ["Structure", q.structure || "-"],
    ],
    customer: [
      ["Customer name", q.customer.name || "-"],
      ["Mobile / WhatsApp", q.customer.mobile || "-"],
      ["Site address", q.customer.address || "-"],
      ["Quotation no. / date", `${q.no}  /  ${dmy(q.date)}`],
    ],
    generation: [
      ["Per day", `${inr(kw*4)} - ${(kw*4.5).toLocaleString("en-IN",{maximumFractionDigits:1})} units`],
      ["Per month (30 days)", `${inr(kw*4*30)} - ${inr(kw*4.5*30)} units`],
      ["Per year (365 days)", `${inr(kw*4*365)} - ${inr(kw*4.5*365)} units`],
    ],
    yearly: `${inr(kw*4*365)} - ${inr(kw*4.5*365)} units per year (approx.)`,
    desc: `${q.panel.company} ${q.panel.watt} Wp ${q.panel.model} panels x ${q.panel.qty||0} Nos (${dc.toFixed(2)} kWp), ` +
          `${kwText(q.capacity)} KW Rooftop Solar System with ${q.inverter.kw} kW ${q.inverter.company} inverter, ${q.phase}. Including installation & GST.`,
    schedule: [
      ["Token amount for site confirmation", inr(token)],
      ["Advance before material dispatch (80% less token)", inr(Math.max(0, adv - token))],
      ["Balance (20%) after plant installation", inr(price - adv)],
    ],
    scheduleNote: `The token is adjusted against the 80% advance (total advance Rs. ${inr(adv)}). The meter is installed after complete payment.`,
    panelSpecs: [["Make", q.panel.company || "-"], ["Model", q.panel.model || "-"], ["Rated power", `${q.panel.watt || "-"} Wp`], ["Quantity", `${q.panel.qty || 0} Nos`], ["Total DC capacity", `${dc.toFixed(2)} kWp`]].concat(pSpecs),
    inverterSpecs: [["Make", q.inverter.company || "-"], ["Model", q.inverter.model || "-"], ["Capacity", `${q.inverter.kw || "-"} kW`], ["Quantity", `${q.inverter.qty || 0} No`], ["Grid connection", q.phase || "-"]].concat(parseKV(P.inverterSpecs)),

      ["1", K.desc, inr(num(q.price))],

  /* ---------- 7. Why choose us and installation gallery ---------- */

  const gal = Photos.gallery();

    const cols = 3, gap = 3, tw = (CW - gap*(cols-1)) / cols, th = tw * 0.72;

  const n = doc.getNumberOfPages();

  }
  return doc.output("blob");
}

/* ============================================================
   Generated PDFs, kept on this device (one per quotation: the latest made)
   ============================================================ */
function hashStr(t){ let h = 2166136261; for (let i = 0; i < t.length; i++){ h ^= t.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36) + ":" + t.length; }
/* fingerprint of everything that appears in the PDF, so a saved copy is reused only while still up to date */
function pdfFp(q){
  const c = clone(q); delete c.updatedAt; delete c.pdfAt; delete c.createdAt;
  const st = Object.assign({}, Store.settings); delete st.numbering; delete st.updatedAt; delete st.custom;
  return hashStr(JSON.stringify(c) + JSON.stringify(st) + PHOTO_SLOTS.map(([k]) => Photos.at[k] || 0).join(","));
}
const PdfStore = {
  ids: new Set(),
  async init(){ if (!DB.db) return; try { const k = await DB.tx("pdfs", "readonly", s => s.getAllKeys()); this.ids = new Set(k || []); } catch {} },
  has(id){ return this.ids.has(id); },
  async save(q, blob, name){
    if (!DB.db) return false;
    this.ids.add(q.id);
    try { const buf = await blob.arrayBuffer(); await DB.put("pdfs", { id:q.id, buf, name, no:q.no, fp: pdfFp(q), savedAt: Date.now() }); return true; }
    catch (e) { this.ids.delete(q.id); toast("PDF made, but there is no space on this device to keep a copy.", 4200); return false; }
  },
  async get(id){ if (!DB.db) return null; try { return await DB.get("pdfs", id); } catch { return null; } },
  remove(id){ this.ids.delete(id); if (DB.db) DB.del("pdfs", id).catch(()=>{}); }
};

/* ============================================================
   Install app + offline support (PWA)
   ============================================================ */
const PWA = {
  deferred: null,
  standalone(){ return (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true; },
  init(){
    const btn = $("#installbtn");
    window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); this.deferred = e; if (!this.standalone()) btn.classList.remove("hidden"); });
    window.addEventListener("appinstalled", () => { this.deferred = null; btn.classList.add("hidden"); toast("App installed. Open it from your home screen or Start menu.", 4200); });
    btn.onclick = async () => {
      if (!this.deferred) return;
      this.deferred.prompt();
      try { await this.deferred.userChoice; } catch {}
      this.deferred = null; btn.classList.add("hidden");
    };
    const net = () => { const el = $(".brand small"); if (el) el.textContent = navigator.onLine ? "Quotations" : "Quotations · offline"; };
    window.addEventListener("online", net); window.addEventListener("offline", net); net();
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  }
};

    bind("c_addr", v => q.customer.address = v);

    bind("p_model", v => { q.panel.model = v; this.linked(); });
    bind("p_w", v => { q.panel.watt = v; this.linked(); });
    bind("p_qty", v => { q.panel.qty = v; this.linked(); });
    bind("i_co", v => { q.inverter.company = v; this.linked(); });
    bind("i_model", v => { q.inverter.model = v; q.inverter.typeAuto = false; this.linked(); });
    $("#app").querySelectorAll("select[data-dd]").forEach(sel => {
      const inp = $("#" + sel.dataset.dd), key = sel.dataset.key;
      sel.addEventListener("change", () => {
        if (sel.value === "__custom"){ inp.classList.remove("hidden"); inp.value = ""; inp.focus(); }
        else { inp.classList.add("hidden"); inp.value = sel.value; }
        inp.dispatchEvent(new Event("input"));
      });
      inp.addEventListener("change", () => rememberCustom(key, inp.value));
    });
    bind("i_kw", v => { q.inverter.kw = v; this.linked(); });
    bind("i_qty", v => { q.inverter.qty = v; this.linked(); });

    bind("pr_sub", v => q.subsidy = v);
    bind("pr_sublabel", v => q.subsidyLabel = v);
    $("#back").onclick = () => { this.saveNow(); this.go("list"); };
    $("#qsave").onclick = () => { this.saveNow(); toast("Quotation saved on this device"); };
    $("#qdup").onclick = () => { this.saveNow(); this.duplicate(q.id); };
    $("#qdel").onclick = async () => {
      if (!(await askConfirm(`Delete quotation ${q.no} for ${q.customer.name || "this customer"}? This cannot be undone.`))) return;
      clearTimeout(this.saveTimer); Store.removeQuote(q.id); this.go("list"); toast("Quotation deleted");
    };
    $("#bomadd").onclick = () => { q.bom.push({ p:"", make:"", spec:"", qty:"1", unit:"Nos" }); this.renderBom(); this.changed(); const ins = $("#bom").querySelectorAll(".p"); ins[ins.length-1].focus(); };
    $("#bomdef").onclick = async () => { if (await askConfirm("Replace this quotation's BOM with the default BOM from Settings?", "Replace")) { q.bom = clone(Store.settings.bom); syncLinkedRows(q); this.renderBom(); this.changed(); } };
    $("#bomsave").onclick = async () => { if (await askConfirm("Make this BOM the default for all new quotations? Existing quotations will not change.", "Make default", false)) { Store.settings.bom = clone(q.bom); Store.putSettings(); toast("Default BOM updated"); } };
  },
  linked(){ syncLinkedRows(this.cur); this.renderBom(true); },
  /* new quotations: inverter type follows the meter phase until you pick a type yourself */
  followPhase(){
    const q = this.cur; if (!q || !q.inverter.typeAuto) return;
    const m = String(q.inverter.model || ""), i = m.indexOf(" – "); if (i < 0) return;
    const want = m.slice(0, i) + " – " + (/three/i.test(q.phase) ? "Three Phase" : "Single Phase");
    if (want === m || !INV_TYPES.includes(want)) return;
    q.inverter.model = want;
    const sel = $("#i_model_sel"), inp = $("#i_model"); if (sel) sel.value = want; if (inp){ inp.value = want; inp.classList.add("hidden"); }
  },
  renderBom(keepFocus){
    const q = this.cur, box = $("#bom"); if (!box) return;
    const active = document.activeElement, aId = active && active.dataset && active.dataset.k;
    box.innerHTML = q.bom.map((r,i) => `
      <div class="bomrow">
        <div class="sr">${i+1}</div>
        <div class="fields">
          <input class="p" data-i="${i}" data-f="p" data-k="${i}p" value="${esc(r.p)}" placeholder="Item / particulars" aria-label="Item ${i+1} particulars">
          <input data-i="${i}" data-f="make" data-k="${i}make" value="${esc(r.make)}" placeholder="Make / brand" aria-label="Item ${i+1} make" ${r.link==="panel"||r.link==="inverter"?"readonly":""}>
          <input data-i="${i}" data-f="spec" data-k="${i}spec" value="${esc(r.spec)}" placeholder="Specification" aria-label="Item ${i+1} specification" ${r.link?"readonly":""}>
          <div class="qty" style="grid-column:1/-1">
            <input data-i="${i}" data-f="qty" data-k="${i}qty" value="${esc(r.qty)}" placeholder="Qty" inputmode="decimal" aria-label="Item ${i+1} quantity" ${r.link==="panel"||r.link==="inverter"?"readonly":""}>
            <input data-i="${i}" data-f="unit" data-k="${i}unit" value="${esc(r.unit)}" placeholder="Unit" aria-label="Item ${i+1} unit">
          </div>
          ${r.link ? `<div class="linked">Filled from the ${r.link} details above <button class="ib" style="width:auto;height:auto;font-size:12px;padding:2px 6px;color:inherit;text-decoration:underline" data-unlink="${i}">edit freely</button></div>` : ""}
        </div>
        <div class="tools">
          <button class="ib" data-up="${i}" aria-label="Move item ${i+1} up" ${i===0?"disabled":""}>↑</button>
          <button class="ib" data-down="${i}" aria-label="Move item ${i+1} down" ${i===q.bom.length-1?"disabled":""}>↓</button>
          <button class="ib del" data-rm="${i}" aria-label="Delete item ${i+1}">✕</button>
        </div>
      </div>`).join("");
    box.querySelectorAll("input[data-f]").forEach(el => el.addEventListener("input", () => { q.bom[+el.dataset.i][el.dataset.f] = el.value; this.changed(); }));
    box.querySelectorAll("[data-up]").forEach(b => b.onclick = () => this.moveBom(+b.dataset.up, -1));
    box.querySelectorAll("[data-down]").forEach(b => b.onclick = () => this.moveBom(+b.dataset.down, 1));
    box.querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => { const i = +b.dataset.rm, r = q.bom[i]; if (!r.p || await askConfirm(`Delete "${r.p}" from the BOM?`)) { q.bom.splice(+b.dataset.rm,1); this.renderBom(); this.changed(); } });
    box.querySelectorAll("[data-unlink]").forEach(b => b.onclick = () => { delete q.bom[+b.dataset.unlink].link; this.renderBom(); this.changed(); });
    if (keepFocus && aId){ const el = box.querySelector(`[data-k="${aId}"]`); if (el) el.focus(); }
  },
  moveBom(i, d){ const q = this.cur, j = i + d; if (j < 0 || j >= q.bom.length) return; [q.bom[i], q.bom[j]] = [q.bom[j], q.bom[i]]; this.renderBom(); this.changed(); },
  updateCalcs(){
    const q = this.cur; if (!q) return;
    const dc = dcKwp(q);
    $("#dcout").textContent = dc ? dc.toFixed(2) + " kWp" : "—";
    const w = $("#dcwarn"), cap = num(q.capacity);
    if (dc && cap && Math.abs(dc - cap) / cap > 0.1){ w.textContent = `Panels give ${dc.toFixed(2)} kWp, but system capacity is ${kwText(cap)} kW. Check panel quantity.`; w.classList.remove("hidden"); }
    else w.classList.add("hidden");
    $("#effout").textContent = "Rs. " + inr(effective(q));
    $("#words").textContent = num(q.price) ? `Rupees ${words(num(q.price))} Only (project price)` : "";
  },
  changed(){
    this.updateCalcs();
    if (this.pdf){ this.pdf = null; this.renderBar(); }
    this.setStatus("Saving…");
    clearTimeout(this.saveTimer); this.saveTimer = setTimeout(() => this.saveNow(), 600);
  },
  saveNow(){ if (!this.cur) return; clearTimeout(this.saveTimer); Store.putQuote(clone(this.cur)); this.setStatus(Store.synced ? "Saved to your account" : "Saved on this device"); },
  setStatus(t){ const s = $("#savestate"); if (s) s.textContent = t; },
  missing(){
    const q = this.cur, m = [];

    if (!num(q.price)) m.push("project price");
    return m;

  renderBar(){
    const bar = $("#bar"); bar.classList.remove("hidden");

      ${ready ? `

        <button class="btn wa" id="wa">WhatsApp customer</button>
        <button class="btn outline" id="pv">Preview</button>
        <button class="btn outline" id="share">Share PDF</button>` : `
        <button class="btn outline" id="pv">Preview</button>
        <button class="btn accent" id="gen">Generate PDF</button>`}
    </div>`;
    $("#pv").onclick = () => this.preview();
    if (ready){
      $("#dl").onclick = () => this.download();
      $("#wa").onclick = () => this.whatsapp();
      $("#share").onclick = () => this.share();
    } else $("#gen").onclick = () => this.generate();

  fileName(){ const q = this.cur; return `Quotation_${q.no.replace(/[\/\\]/g,"-")}_${(q.customer.name||"Customer").replace(/[^\w]+/g,"_")}.pdf`; },
  async generate(){
    const m = this.missing();
    if (m.length){ toast("Please enter " + m.join(", ") + " first."); return; }
    this.saveNow();
    const btn = $("#gen"); btn.disabled = true; btn.textContent = "Making PDF…";
    try {
      this.pdf = await buildPdf(this.cur);
      this.cur.pdfAt = Date.now(); this.saveNow();
      const kept = await PdfStore.save(this.cur, this.pdf, this.fileName());
      this.renderBar(); toast(kept ? "PDF ready and saved on this device. Download or share it." : "PDF ready. Download it or send it on WhatsApp.");
    } catch (e) { console.error(e); btn.disabled = false; btn.textContent = "Generate PDF"; toast("PDF could not be made: " + e.message); }
  },
  async download(){ if (this.pdf) await saveBlob(this.pdf, this.fileName(), "PDF downloaded"); },
  async share(){ if (this.pdf) await shareBlob(this.pdf, this.fileName(), this.cur); },
  whatsapp(){
    const n = waNumber(this.cur.customer.mobile);

    const url = `https://wa.me/${n}?text=${encodeURIComponent(fill(Store.settings.wa, this.cur))}`;

      <section class="card"><header><h2>Logo and stamp</h2></header><div class="body">
        <div class="row" style="gap:18px">
          <div><div class="thumb">${S.logo ? `<img src="${S.logo}" alt="Logo">` : '<span class="muted" style="font-size:13px">No logo</span>'}</div>
            <div class="row" style="margin-top:6px"><label class="btn sm outline">Upload logo<input type="file" accept="image/png,image/jpeg" id="up_logo" class="hidden"></label>${S.logo ? '<button class="ib del" id="rm_logo" aria-label="Remove logo">✕</button>' : ""}</div></div>
          <div><div class="thumb">${S.stamp ? `<img src="${S.stamp}" alt="Stamp">` : '<span class="muted" style="font-size:13px">No stamp</span>'}</div>
            <div class="row" style="margin-top:6px"><label class="btn sm outline">Upload stamp + signature<input type="file" accept="image/png,image/jpeg" id="up_stamp" class="hidden"></label>${S.stamp ? '<button class="ib del" id="rm_stamp" aria-label="Remove stamp">✕</button>' : ""}</div></div>
        </div>
        <label class="row" style="margin-top:12px; font-size:15px"><input type="checkbox" id="wmark" style="width:22px;min-height:22px" ${S.watermark?"checked":""}> Print the logo faintly behind every page (watermark)</label>
      </div></section>

      <section class="card"><header><h2>Photos for the quotation</h2></header><div class="body">
        <p class="muted" style="margin-top:0; font-size:14px">Use your own photos. Installation photos appear on the cover and in the gallery; the others appear next to the panel, inverter and component details. Empty slots use a simple illustration.</p>
        <div class="phgrid">${PHOTO_SLOTS.map(([k,l]) => `<div class="phslot"><div class="thumb wide">${Photos.get(k) ? `<img src="${Photos.get(k)}" alt="${l}">` : `<span class="muted" style="font-size:12px">No photo</span>`}</div>
          <div class="phl">${l}${Photos.isDefault(k) ? ' <span class="chip">built-in</span>' : ""}</div><div class="row" style="gap:4px"><label class="btn sm outline" style="flex:1">${Photos.get(k) ? "Replace" : "Upload"}<input type="file" accept="image/png,image/jpeg,image/webp" data-ph="${k}" class="hidden"></label>${Photos.get(k) ? `<button class="ib del" data-phrm="${k}" aria-label="Remove ${l} photo">✕</button>` : ""}</div></div>`).join("")}</div>
      </div></section>

      <section class="card"><header><h2>Company letterhead</h2></header><div class="body grid r">
        <div class="full">${F("company.name","Company name",C.name)}</div>
        ${F("company.tagline","Tagline",C.tagline)}<div class="full">${F("company.headerLine","Header line (approval and licence)",C.headerLine)}</div>
        ${F("company.person","Signatory name (optional, leave blank to hide)",C.person)}
        ${F("company.designation","Designation",C.designation)}${F("company.phones","Phone numbers",C.phones)}
        ${F("company.gstin","GSTIN",C.gstin)}${F("company.email","Email",C.email,'type="email"')}
        <div class="full">${F("company.address","Office address (not printed in header)",C.address)}</div>
      </div></section>

      <section class="card"><header><h2>Bank details</h2></header><div class="body grid r">
        ${F("bank.name","Bank name",B.name)}${F("bank.branch","Branch (optional)",B.branch)}
        <div class="full">${F("bank.accountName","Account name",B.accountName)}</div>
        ${F("bank.accountNo","Account number",B.accountNo,'inputmode="numeric"')}${F("bank.ifsc","IFSC",B.ifsc)}
      </div></section>

      <section class="card"><header><h2>Proposal content</h2></header><div class="body">
        <p class="muted" style="margin-top:0; font-size:14px">One item per line. Specification lines use "Label: value". Make, model, wattage, capacity and quantity come from each quotation automatically.</p>
        ${[["panelSpecs","Extra panel specifications"],["panelFeatures","Panel features"],["inverterSpecs","Extra inverter specifications"],["inverterFeatures","Inverter features"],["warranty","Warranty and generation table (Label: value)"],["why","Why choose us"]].map(([k,l]) => `<label class="f" style="margin-bottom:10px"><span>${l}</span><textarea data-pl="${k}" rows="${Math.min(8,(S.product[k]||[]).length+1)}">${esc((S.product[k]||[]).join("\n"))}</textarea></label>`).join("")}
        <label class="f" style="margin-bottom:10px"><span>Panel certifications</span><input data-ps="certifications" value="${esc(S.product.certifications)}"></label>
        <label class="f" style="margin-bottom:10px"><span>Company profile</span><textarea data-ps="profile" rows="4">${esc(S.product.profile)}</textarea></label>
        ${COMPONENTS.map(c => `<label class="f" style="margin-bottom:10px"><span>${c.title}: description</span><textarea data-pc="${c.key}" rows="2">${esc(S.product.components[c.key])}</textarea></label>`).join("")}
      </div></section>

      <section class="card"><header><h2>Cover letter</h2></header><div class="body">
        <p class="muted" style="margin-top:0; font-size:14px">One paragraph per box. {kw} becomes the system capacity.</p>
        ${S.letter.map((p,i)=>`<label class="f" style="margin-bottom:10px"><span>Paragraph ${i+1}</span><textarea data-letter="${i}" rows="3">${esc(p)}</textarea></label>`).join("")}
      </div></section>

      <section class="card"><header><h2>Terms, warranty and notes</h2></header><div class="body">
        <p class="muted" style="margin-top:0; font-size:14px">One term per line.</p>
        ${S.terms.map((t,i)=>`<label class="f" style="margin-bottom:12px"><span class="muted" style="font-weight:600;font-size:13px">Printed on page ${t.page||5}: ${(t.page||5)===5?"Terms of business":"Warranty and performance guarantee"}</span><span><input data-ttitle="${i}" value="${esc(t.title)}" aria-label="Section title" style="min-height:38px; font-weight:700"></span><textarea data-terms="${i}" rows="${Math.min(10, t.lines.length*2+1)}">${esc(t.lines.join("\n"))}</textarea></label>`).join("")}
      </div></section>

      <section class="card"><header><h2>WhatsApp message</h2></header><div class="body">
        <p class="muted" style="margin-top:0; font-size:14px">{name}, {no}, {kw}, {price}, {subsidy} and {effective} fill in automatically.</p>
        <textarea id="watpl" rows="9">${esc(S.wa)}</textarea>
      </div></section>

      <section class="card"><header><h2>Quotation numbers</h2></header><div class="body grid">
        ${F("numbering.prefix","Prefix",S.numbering.prefix)}
        <label class="f"><span>Next number</span><input data-k="numbering.next" value="${esc(S.numbering.next)}" inputmode="numeric"></label>
        <div class="full muted" style="font-size:14px">Next quotation: <b id="nextno">${esc(Store.peekNumber())}</b></div>
      </div></section>

      <section class="card"><header><h2>Backup</h2></header><div class="body">
        <p class="muted" style="margin-top:0; font-size:14px" id="syncnote2"></p>
        <div class="row"><button class="btn outline sm" id="export">Backup data</button>
          <label class="btn outline sm">Restore data<input type="file" accept="application/json,.json" id="import" class="hidden"></label>
          <button class="btn danger sm" id="resetdef">Restore original defaults</button></div>
      </div></section>`;
    $("#syncnote2").textContent = "Quotations, settings, photos and saved PDFs are stored only on this device. Nothing is sent online and no account is needed. Tap Backup data now and then, and keep the file safe (for example copy it to a pendrive or your laptop). " + (Store.lastBackup ? "Last backup: " + dt(Store.lastBackup) + "." : "No backup made yet on this device.");

    let t = 0; const save = () => { clearTimeout(t); t = setTimeout(() => { Store.putSettings(); }, 400); };
    $("#app").querySelectorAll("input[data-k]").forEach(el => el.addEventListener("input", () => {
      const [a,b] = el.dataset.k.split("."); S[a][b] = (a==="numbering" && b==="next") ? Math.max(1, parseInt(el.value)||1) : el.value;
      $("#nextno").textContent = Store.peekNumber(); save();
    }));
    $("#app").querySelectorAll("[data-letter]").forEach(el => el.addEventListener("input", () => { S.letter[+el.dataset.letter] = el.value; save(); }));
    $("#app").querySelectorAll("[data-terms]").forEach(el => el.addEventListener("input", () => { S.terms[+el.dataset.terms].lines = el.value.split("\n"); save(); }));
    $("#app").querySelectorAll("[data-ttitle]").forEach(el => el.addEventListener("input", () => { S.terms[+el.dataset.ttitle].title = el.value; save(); }));
    $("#app").querySelectorAll("[data-pl]").forEach(el => el.addEventListener("input", () => { S.product[el.dataset.pl] = el.value.split("\n"); save(); }));
    $("#app").querySelectorAll("[data-ps]").forEach(el => el.addEventListener("input", () => { S.product[el.dataset.ps] = el.value; save(); }));
    $("#app").querySelectorAll("[data-pc]").forEach(el => el.addEventListener("input", () => { S.product.components[el.dataset.pc] = el.value; save(); }));
    $("#app").querySelectorAll("[data-ph]").forEach(el => el.onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      if (!/^image\/(png|jpe?g|webp)$/.test(f.type)){ toast("Use a JPG, PNG or WEBP photo."); return; }
      Photos.set(el.dataset.ph, await shrinkImage(f, 1100, true)); this.renderSettings(); toast("Photo saved");
    });
    $("#app").querySelectorAll("[data-phrm]").forEach(b => b.onclick = () => { Photos.set(b.dataset.phrm, ""); this.renderSettings(); });
    $("#watpl").addEventListener("input", e => { S.wa = e.target.value; save(); });
    $("#wmark").onchange = e => { S.watermark = e.target.checked; Store.putSettings(); };
    const upload = (id, key) => $(id).onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      if (!/^image\/(png|jpe?g)$/.test(f.type)){ toast("Use a PNG or JPG image."); return; }
      S[key] = await shrinkImage(f, key === "logo" ? 700 : 600); Store.putSettings(); this.renderSettings(); toast(key === "logo" ? "Logo saved" : "Stamp saved");
    };
    upload("#up_logo","logo"); upload("#up_stamp","stamp");
    if ($("#rm_logo")) $("#rm_logo").onclick = () => { S.logo = ""; Store.putSettings(); this.renderSettings(); };
    if ($("#rm_stamp")) $("#rm_stamp").onclick = () => { S.stamp = ""; Store.putSettings(); this.renderSettings(); };
    $("#export").onclick = async () => {
      const photos = {}; for (const [k] of PHOTO_SLOTS) if (Photos.at[k]) photos[k] = { data: Photos.data[k] || "", at: Photos.at[k] };
      const data = JSON.stringify({ app:"shreenath-quotations", version:2, exportedAt:new Date().toISOString(), settings:S, quotes:Store.quotes, photos }, null, 1);
      const name = `shreenath-quotations-backup-${today()}.json`;
      await saveBlob(new Blob([data], { type:"application/json" }), name, "Backup file downloaded");
      Store.lastBackup = Date.now(); if (DB.db) DB.put("kv", Store.lastBackup, "lastBackup").catch(()=>{});
      const n = $("#syncnote2"); if (n) n.textContent = n.textContent.replace(/(Last backup: .*|No backup made yet on this device\.)$/, "Last backup: " + dt(Store.lastBackup) + ".");
    };
    $("#import").onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try { const d = JSON.parse(await f.text()); if (d.app !== "shreenath-quotations") throw new Error("not a backup");
        const qs = Object.values(d.quotes || {}).filter(q => q && q.id && !q.deleted && q.customer);
        const ph = Object.entries(d.photos || {}).filter(([k]) => PHOTO_SLOTS.some(([x]) => x === k));
        if (!(await askConfirm(`Restore ${qs.length} quotations${ph.length ? ", " + ph.length + " photos" : ""} and settings from this backup? Quotations already on this device with the same entry are replaced.`, "Restore", false))) { e.target.value = ""; return; }
        if (d.settings) { Store.settings = mergeSettings(d.settings); Store.putSettings(); }
        for (const q of qs) Store.restoreQuote(q);
        for (const [k, v] of ph) Photos.set(k, (v && v.data) || "", (v && v.at) || Date.now());
        toast("Backup restored"); this.renderSettings();
      } catch { toast("That file is not a Shreenath quotation backup."); }
      e.target.value = "";
    };
    $("#resetdef").onclick = async () => {
      if (!(await askConfirm("Put company details, letter, terms, BOM and WhatsApp message back to the original defaults? Logo, stamp, numbering and saved quotations are kept.", "Restore defaults"))) return;
      const keep = { logo:S.logo, stamp:S.stamp, numbering:S.numbering, watermark:S.watermark, custom:S.custom || {} };
      Store.settings = Object.assign(clone(DEFAULT_SETTINGS), keep); Store.putSettings(); this.renderSettings(); toast("Defaults restored");
    };
  }
};

function shrinkImage(file, max, jpeg){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      res(jpeg ? c.toDataURL("image/jpeg", 0.78) : c.toDataURL("image/png"));
    }; img.onerror = rej; img.src = r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

document.querySelectorAll(".top nav button[data-go]").forEach(b => b.onclick = () => { if (App.view === "edit") App.saveNow(); App.go(b.dataset.go); });
window.addEventListener("pagehide", () => App.saveNow());
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") App.saveNow(); });
$("#toplogo").src = DEFAULT_ASSETS.logo;
PWA.init();
(async () => {
  let first = false;
  try { first = await Store.load(); } catch (e) { console.error(e); Store.loadLocal(); }
  try { await Photos.load(); } catch { Photos.loadLocal(); }
  if (first){ Photos.migrateLocal(); try { await DB.put("kv", 1, "migrated"); } catch {} }
  await PdfStore.init();
  App.refresh();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
})();
</script>
</body>
</html>
